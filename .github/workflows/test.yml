name: tests

on:
  push:
  pull_request:

jobs:
  pytorch-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install matched CPU PyTorch wheels and the standalone package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.1' 'torchvision==0.29.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Run standalone Attention tests
        run: PYTHONPATH=src python -m unittest tests.test_attention tests.test_plug_and_play_attention tests.test_functional_api tests.test_fa4_backend -v
      - name: Install training and test dependencies
        run: python -m pip install -e '.[train,test]'
      - name: Run complete test suite
        run: PYTHONPATH=src python -m pytest -q
      - name: Run examples
        run: |
          PYTHONPATH=src python examples/plug_and_play.py
          PYTHONPATH=src python examples/functional_attention.py
          PYTHONPATH=src python examples/cache_savings.py
