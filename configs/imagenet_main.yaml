experiment_group: imagenet_main_comparison
task: image_classification
dataset:
  name: imagenet1k
  num_classes: 1000
  image_size: 224
  eval_resize_size: 256
  channels: 3
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
model:
  family: vit
  variant: vit_b16_style
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  head_dim: 64
  intermediate_size: 3072
  patch_size: 16
  hidden_dropout: 0.0
  attention_dropout: 0.0
training:
  epochs: 30
  per_device_batch_size: 256
  gradient_accumulation_steps: 2
  effective_batch_size: 512
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 5
  warmup_start_factor: 0.033
  amp: true
  eval_every_epochs: 1
augmentation:
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  label_smoothing: 0.11
hardware:
  reference_setup: single_gpu_per_run
  gpu_class: 80gb_accelerator
compared_methods:
  - baseline
  - fullyshared
  - partialshared_r728
  - lowrank_r32
  - bbt_r64
  - bmbuv_r32s32
  - bmbuv_r64s64
  - bmb_r64
